name: Build ZBT images with Extroot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Image Builder
        run: |
          wget -O ib.tar.zst "https://openwrt.132lan.ru/releases/25.12.5/ramips/mt7620/openwrt-imagebuilder-25.12.5-ramips-mt7620.Linux-x86_64.tar.zst"
          tar --zstd -xf ib.tar.zst
          mv openwrt-imagebuilder-* ib

      - name: Show available profiles
        run: |
          cd ib
          make info | grep -i "zbt\|kroks" || true

      - name: Build ZBT images with Extroot
        run: |
          cd ib
          for PROFILE in zbtlink_zbt-we826-16m zbtlink_zbt-we826-32m zbtlink_zbt-we826-e zbtlink_zbt-wr8305rt; do
            make image PROFILE=$PROFILE \
              PACKAGES="kmod-usb-storage kmod-usb-storage-uas kmod-fs-ext4 kmod-fs-f2fs f2fs-tools kmod-nls-cp437 kmod-nls-iso8859-1 block-mount fdisk losetup kmod-loop"
          done

      - name: Collect artifacts
        run: |
          cd ib
          mkdir -p output
          find bin/targets -name '*sysupgrade*' -exec cp {} output/ \;
          find bin/targets -name '*factory*' -exec cp {} output/ \;

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: zbt-extroot-images
          path: output/
