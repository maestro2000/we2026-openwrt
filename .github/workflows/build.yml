name: Build OpenWrt ZBT WE1626 with Extroot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-pip python3-setuptools rsync unzip zlib1g-dev \
            file wget curl

      - name: Checkout OpenWrt fork
        uses: actions/checkout@v4
        with:
          repository: koshev-msk/openwrt
          ref: 25.12.5-dsa
          fetch-depth: 1

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7620=y
          CONFIG_TARGET_ramips_mt7620_DEVICE_zbt_we1626=y

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y
          CONFIG_PACKAGE_f2fs-tools=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_losetup=y
          CONFIG_PACKAGE_kmod-loop=y
          EOF
          make defconfig

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p output
          find bin/targets -name '*sysupgrade*' -exec cp {} output/ \;
          find bin/targets -name '*factory*' -exec cp {} output/ \;

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-zbt-we1626-extroot
          path: output/
