name: Build OpenWrt ZBT-WR8305RT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget curl zstd

      - name: Find and download Image Builder
        run: |
          BASE="https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt7620"
          FILE=$(curl -fsSL "$BASE/" | grep -o 'openwrt-imagebuilder-25\.12\.5-ramips-mt7620[^"<> ]*\.tar\.zst' | head -n1)
          echo "Found Image Builder: $FILE"
          test -n "$FILE"
          curl -fL "$BASE/$FILE" -o imagebuilder.tar.zst
          tar --zstd -xf imagebuilder.tar.zst
          mv openwrt-imagebuilder-* imagebuilder

      - name: Show ZBT-WR8305RT profile
        working-directory: imagebuilder
        run: |
          make info | grep -i -E 'WR8305RT|WE2026' || true

      - name: Build firmware with Extroot support
        working-directory: imagebuilder
        run: |
          make image \
            PROFILE="zbtlink_zbt-wr8305rt" \
            PACKAGES="block-mount kmod-usb-storage kmod-fs-ext4 e2fsprogs"

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find imagebuilder/bin/targets -type f \( -name '*squashfs-sysupgrade.bin' -o -name '*squashfs-factory.bin' \) -exec cp {} artifact/ \;
          find imagebuilder/bin/targets -type f -name 'sha256sums' -exec cp {} artifact/ \;
          ls -lh artifact

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-zbt-wr8305rt-image
          path: artifact/
