name: Build ZBT WE1626 with Extroot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Image Builder
        run: |
          URL1="https://openwrt.132lan.ru/releases/25.12.5/targets/ramips/mt7620/openwrt-imagebuilder-25.12.5-ramips-mt7620.Linux-x86_64.tar.xz"
          URL2="https://openwrt.132lan.ru/releases/25.12.5/ramips/mt7620/openwrt-imagebuilder-25.12.5-ramips-mt7620.Linux-x86_64.tar.xz"
          wget -O ib.tar.xz "$URL1" || wget -O ib.tar.xz "$URL2"
          tar -xf ib.tar.xz
          mv openwrt-imagebuilder-* ib

      - name: Build image with Extroot
        run: |
          cd ib
          make image PROFILE=zbt-we1626 \
            PACKAGES="kmod-usb-storage kmod-usb-storage-uas kmod-fs-ext4 kmod-fs-f2fs f2fs-tools kmod-nls-cp437 kmod-nls-iso8859-1 block-mount fdisk losetup kmod-loop"

      - name: Collect artifacts
        run: |
          cd ib
          mkdir -p output
          find bin/targets -name '*sysupgrade*' -exec cp {} output/ \;
          find bin/targets -name '*factory*' -exec cp {} output/ \;

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: zbt-we1626-extroot
          path: output/
